<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프롬프트 엔지니어링 마스터 클래스 | 동덕여대 AI콘텐츠제작</title>
  
  <!-- 한글 웹폰트: 사용자 로컬 폰트에 의존하지 않도록 명시적 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & Babel CDN 로드 (오프라인 더블 클릭 구동 지원) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================
       📚 Claude Code 마스터 클래스 스타일 프롬프트 훈련 플랫폼 CSS
       ========================================== */

    :root {
      /* 다크 테마 기본값 */
      --bg: #0e0f13;
      --panel: #15171d;
      --panel2: #1b1e26;
      --ink: #e7e3da;
      --ink-dim: #a7a396;
      --line: #2a2d38;
      --accent: #e07a4b;       /* 오렌지 악센트 */
      --accent2: #c9a86a;      /* 금빛 악센트 */
      --code-bg: #1a1d24;
      --color-primary: #06b6d4;
      --color-accent: #10b981;
      --sidebar-w: 280px;
      --max-w: 880px;
    }

    :root[data-theme="light"] {
      /* 라이트 테마 변수 */
      --bg: #f4f1ea;
      --panel: #fbf9f4;
      --panel2: #efe9dd;
      --ink: #26241f;
      --ink-dim: #6b6656;
      --line: #ded7c7;
      --accent: #c25a2c;
      --accent2: #a8813a;
      --code-bg: #f0ebe0;
      --color-primary: #0891b2;
      --color-accent: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.75;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 전체 레이아웃 */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* 📂 좌측 사이드바 목차 (TOC) */
    .sidebar {
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(224, 122, 75, 0.25);
    }

    .brand b {
      font-size: 15px;
      letter-spacing: 0.2px;
      color: var(--ink);
    }

    .brand small {
      display: block;
      color: var(--ink-dim);
      font-size: 11px;
      font-weight: 400;
      margin-top: 2px;
    }

    .toc-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .toc-ch {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--ink-dim);
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: break-word;
      line-height: 1.35;
    }
    .toc-label {
      flex: 1 1 auto;
      min-width: 0;
      display: inline-block;
    }

    .toc-ch:hover {
      background: var(--panel2);
      color: var(--ink);
    }

    .toc-ch.active {
      background: rgba(224, 122, 75, 0.12);
      color: var(--accent);
    }

    .toc-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--accent2);
      min-width: 20px;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    .toc-ch.active .toc-num {
      color: var(--accent);
    }

    .toc-ch.done .toc-label::after {
      content: " ✓";
      color: var(--color-accent);
      font-weight: 800;
      margin-left: 6px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .theme-btn {
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
    }

    .theme-btn:hover {
      border-color: var(--accent);
    }

    /* 📖 중앙 메인 콘텐츠 영역 */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
      padding: 0 40px;
      overflow-y: auto;
    }

    .content {
      width: 100%;
      max-width: var(--max-w);
      padding: 48px 0 100px;
    }

    /* 히어로 카드 */
    .hero {
      background: linear-gradient(135deg, rgba(224, 122, 75, 0.08), var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
    }

    .hero .kicker {
      font-family: monospace;
      font-size: 11px;
      color: var(--accent2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: 28px;
      line-height: 1.3;
      margin: 8px 0;
      color: var(--ink);
    }

    .hero p {
      color: var(--ink-dim);
      font-size: 14.5px;
    }

    /* 챕터 문서 본문 */
    .chapter-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chapter-section h2 {
      font-size: 22px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      margin-top: 24px;
      color: var(--ink);
    }

    .chapter-section h3 {
      font-size: 17px;
      color: var(--accent);
      margin-top: 14px;
    }

    .chapter-section p {
      color: var(--ink-dim);
      font-size: 15px;
    }

    .chapter-section ul, .chapter-section ol {
      padding-left: 24px;
      color: var(--ink-dim);
    }

    .chapter-section li {
      margin-bottom: 6px;
    }

    .chapter-section strong {
      color: var(--ink);
    }

    .chapter-section blockquote {
      padding: 10px 16px;
      border-left: 3px solid var(--accent);
      background: var(--panel);
      border-radius: 0 8px 8px 0;
      color: var(--ink-dim);
      font-style: italic;
    }

    .chapter-section pre {
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13.5px;
    }

    /* 📊 내장형 플레이그라운드 (터미널 테마) */
    .pg-terminal {
      background: #0b0c10;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin: 24px 0;
    }

    .pg-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #15171d;
      border-bottom: 1px solid var(--line);
    }

    .pg-bar i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      display: inline-block;
    }

    .pg-bar i:nth-child(1) { background: #e0574e; }
    .pg-bar i:nth-child(2) { background: #c9a86a; }
    .pg-bar i:nth-child(3) { background: #3aa76d; }

    .pg-bar span {
      margin-left: 6px;
      font-size: 11px;
      color: var(--ink-dim);
    }

    .pg-mission {
      padding: 10px 14px;
      background: #12131a;
      border-bottom: 1px solid #24262f;
      font-size: 13px;
      color: #cfcabb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pg-mission-tag {
      font-size: 11px;
      color: #d9b775;
      border: 1px solid #3a3d49;
      border-radius: 20px;
      padding: 2px 8px;
    }

    .pg-interactive-area {
      padding: 16px;
      background: #090a0d;
    }

    .pg-textarea {
      width: 100%;
      height: 76px;
      background: #0e0f14;
      border: 1px solid #2a2d38;
      border-radius: 8px;
      padding: 10px;
      color: #a7f3d0;
      font-family: monospace;
      font-size: 13.5px;
      resize: none;
      margin-bottom: 12px;
    }

    .pg-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* 게이지 컨트롤 */
    .power-gauge {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2a2d38;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
    }

    .gauge-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--color-accent) 100%);
      transition: width 0.3s ease;
    }

    .gauge-feedback {
      font-size: 11px;
      color: var(--color-primary);
    }

    .pg-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pg-btn {
      background: var(--accent);
      color: #0e0f13;
      font-weight: 800;
      font-size: 13px;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pg-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      box-shadow: 0 0 8px rgba(224, 122, 75, 0.4);
    }

    .pg-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 터미널 출력 결과 */
    .pg-terminal-out {
      margin-top: 14px;
      padding: 12px;
      background: #06070a;
      border: 1px solid #20232b;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .pg-clear-banner {
      margin-top: 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--color-accent);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pg-clear-banner span {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-accent);
    }

    /* ✏️ 확인 퀴즈 블록 (Quiz) */
    .quiz {
      margin: 32px 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(201, 168, 106, 0.08), var(--panel));
    }

    .quiz-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--accent2);
      margin-bottom: 12px;
    }

    .quiz-head::before {
      content: "✏️";
    }

    .quiz-question {
      font-weight: 700;
      font-size: 14.5px;
      margin-bottom: 14px;
      color: var(--ink);
    }

    .quiz-opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quiz-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      transition: all 0.2s ease;
    }

    .quiz-opt:hover {
      border-color: var(--accent);
      background: rgba(224, 122, 75, 0.05);
    }

    .quiz-mark {
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      border: 2px solid var(--line);
      border-radius: 50%;
    }

    .quiz-opt.correct {
      border-color: #3aa76d;
      background: rgba(58, 167, 109, 0.12);
    }

    .quiz-opt.correct .quiz-mark {
      border-color: #3aa76d;
      background: #3aa76d;
      position: relative;
    }

    .quiz-opt.correct .quiz-mark::after {
      content: "✓";
      position: absolute;
      inset: 0;
      color: #fff;
      font-size: 10px;
      line-height: 13px;
      text-align: center;
      font-weight: 800;
    }

    .quiz-opt.wrong {
      border-color: #d05a4e;
      background: rgba(208, 90, 78, 0.1);
    }

    .quiz-opt.wrong .quiz-mark {
      border-color: #d05a4e;
      background: #d05a4e;
      position: relative;
    }

    .quiz-opt.wrong .quiz-mark::after {
      content: "✕";
      position: absolute;
      inset: 0;
      color: #fff;
      font-size: 9px;
      line-height: 13px;
      text-align: center;
      font-weight: 800;
    }

    .quiz-explain {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      background: var(--code-bg);
      border: 1px solid var(--line);
      color: var(--ink-dim);
    }

    /* ==========================================
       📜 수료증 모달 (Certificate)
       ========================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--panel);
      border: 2px solid var(--accent2);
      box-shadow: 0 0 30px rgba(201, 168, 106, 0.25);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 580px;
      position: relative;
      text-align: center;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      background: transparent;
      border: none;
      color: var(--ink-dim);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cert-card {
      background: radial-gradient(circle at center, #1b202e 0%, #0d0f17 100%);
      border: 2px solid #d4af37;
      padding: 40px 30px;
      border-radius: 12px;
      color: #f3f4f6;
      position: relative;
    }

    .cert-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #d4af37;
    }

    .c-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .c-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .c-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .c-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .cert-univ {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #d4af37;
      margin-bottom: 20px;
    }

    .cert-head {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      margin-bottom: 28px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .cert-main {
      font-size: 0.92rem;
      line-height: 1.8;
      margin-bottom: 36px;
      color: #d1d5db;
    }

    .cert-main strong {
      color: #fff;
      font-size: 1.05rem;
    }

    .cert-date {
      font-size: 0.82rem;
      color: var(--ink-dim);
      margin-bottom: 8px;
    }

    .cert-sign {
      font-size: 1.1rem;
      font-weight: 700;
      color: #d4af37;
    }

    .cert-print-btn {
      background: linear-gradient(135deg, var(--accent2), #b8974a);
      color: #0e0f13;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      margin-top: 16px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cert-print-btn:hover {
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* 실시간 3대 속성 체크리스트 */
    .attribute-checklist {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .attr-item {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12.0px;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .attr-item.active {
      border-color: var(--color-accent);
      background: rgba(16, 185, 129, 0.08);
      color: var(--color-accent);
    }

    .attr-item.inactive {
      border-color: #d05a4e;
      background: rgba(208, 90, 78, 0.05);
      color: #d05a4e;
    }

    /* ==========================================
       📖 프롬프트 플레이북 전용 스타일
       ========================================== */
    :root {
      --playbook-accent: #d9f24a;
    }
    :root[data-theme="light"] {
      --playbook-accent: #6b8e00;
    }

    .section-heading {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-dim);
      letter-spacing: 0;
      margin: 20px 0 8px 4px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: keep-all;
      line-height: 1.4;
    }
    .section-heading::before {
      content: "//";
      color: var(--accent2);
      font-family: monospace;
      font-size: 11px;
      flex-shrink: 0;
    }

    .toc-ch.playbook.active {
      background: rgba(217, 242, 74, 0.15);
      color: var(--playbook-accent);
    }
    .toc-ch.playbook.active .toc-num {
      color: var(--playbook-accent);
    }
    .toc-ch.playbook .toc-num {
      color: var(--playbook-accent);
    }

    .hero.playbook {
      background: linear-gradient(135deg, rgba(217, 242, 74, 0.08), var(--panel));
    }
    .hero.playbook .kicker {
      color: var(--playbook-accent);
    }

    .playbook-body h3 {
      color: var(--playbook-accent);
    }
    .playbook-body blockquote {
      border-left-color: var(--playbook-accent);
      background: rgba(217, 242, 74, 0.04);
    }

    .pb-badge {
      display: inline-block;
      font-size: 10.5px;
      font-family: monospace;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(217, 242, 74, 0.15);
      color: var(--playbook-accent);
      border: 1px solid var(--playbook-accent);
      margin-left: 8px;
      vertical-align: middle;
    }

    .pb-tip {
      border-left: 3px solid var(--playbook-accent);
      background: rgba(217, 242, 74, 0.06);
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      margin: 14px 0;
      color: var(--ink);
      font-size: 14px;
    }

    .pb-callout {
      background: #0b0c10;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin: 10px 0 14px;
      color: #cfcabb;
      font-family: monospace;
      font-size: 13.2px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .pb-callout-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 6px;
    }

### 2. 핵심 엔진 용어 사전
*   **LLM (대규모 언어 모델)**: 방대한 텍스트 데이터를 사전 학습하여 문맥의 다음 가장 유력한 어휘를 찾아내는 확률론적 예측 엔진입니다.

*   **Context Window (컨텍스트 윈도우)**: 모델이 한 번에 기억하고 소화할 수 있는 정보의 한계량입니다.

*   **RAG (검색 증강 생성)**: 프롬프트 외부에 존재하는 문서나 사내 데이터를 실시간 검색해서 맥락에 붙여 넣어 할루시네이션을 원천 억제하는 기술입니다.
*   **ReAct (Reason + Act)**: AI가 "생각 ➔ 행동(웹 검색 등 도구 실행) ➔ 관찰 ➔ 다음 생각" 구조를 무한 루프처럼 연쇄적으로 밟으며 외부 리소스와 결합해 스스로 임무를 완수하는 에이전틱 워크플로우의 모태입니다.

AI가 쓴 글은 두 문단이면 알아봅니다. 흔히 "영혼이 없다"고 하는데, 아름답지만 쓸모없는 설명입니다. 실제로는 **습관 몇 개가 반복되는 것**이고, 그 목록은 유한합니다. 유한하다면 금지 목록으로 만들어 넘길 수 있습니다.

### 반복되는 열두 가지

- **이중 피동** — 되어집니다, 보여집니다, 사료됩니다
- **과잉 명사화** — ~에 대한 검토를 진행, ~을 통하여

- **번역투 접속** — 또한, 나아가, 뿐만 아니라

### 목록을 그대로 넘긴다

열두 개를 문장으로 설명하려 들지 마세요. **그대로 금지 목록으로 붙여 넣으면** 됩니다. 판정이 기계적으로 되는 항목일수록 잘 지켜집니다.

7장의 목표는 이 열두 개를 지우는 것이 아니라, 지운 자리에 내 습관을 채워 넣는 것입니다.

### 내 문체를 뽑아내기

금지 목록만 적용해 보면 재밌는 일이 벌어집니다. 상투어는 사라지는데 **글에서 사람도 같이 사라집니다.** 밋밋한 무색 문장이 남습니다. 여기가 출발점입니다.

내가 쓴 글 열다섯에서 서른 편을 모으세요. 게시물, 고객에게 보낸 메일, 업무 메시지, 음성 녹취 전사본. **남이 손본 글과 스스로 별로라고 생각하는 글은 빼세요.**

### 관찰만 시키기

마지막 규칙이 전부입니다. 이걸 빼면 **칭찬만 잔뜩** 돌아오고, 거기서는 규칙을 한 줄도 못 뽑습니다.

### 문체를 파일로 굳히기

관찰 결과를 파일 하나에 옮겨 적습니다. 코드는 한 줄도 필요 없고, 그냥 텍스트 파일입니다. 대화 시작할 때 붙여 넣거나, 프로젝트 폴더에 두고 읽게 하면 됩니다.

1. **금지** — 내 글에 절대 없는 것 — 기계적 판정 가능하게

### 피드백을 자산으로

결과물이 마음에 안 들 때 대화창에서 "좀 더 자연스럽게"라고 말하면 그 순간만 고쳐집니다. 내일 새 대화에서 똑같이 설명해야 합니다. **고칠 때마다 파일에 한 줄씩 옮겨 적으세요.**

| 그 자리에서 끝나는 말 | 파일에 남는 말 |
|---|---|

오른쪽처럼 **검증 가능한 문장**으로 바꿔 적어야 내일도 작동합니다. 평가는 파일에 적을 것이 없습니다.

### 스스로 검토는 못 한다

같은 대화에서 자기 글을 비판하라고 하면 대체로 괜찮다고 합니다. 검토는 **새 대화**에서, 문체 파일만 함께 넣어 시키세요.

| 규칙 | 대화 시작마다 읽히는 파일 | 폴더 지도, 말투, 금지 |
| 역할 | 전문가 설정 모음 | 검토자, 기획자, 비판자 |
| 창구 | 접근 통로 | 에디터, 메신저 봇 |

필요한 것은 AI 에디터 하나와 빈 폴더 하나입니다. 준비 시간은 두 시간 남짓입니다.

### 폴더는 번호로 나눈다

폴더를 이름순으로만 두면 금세 뒤엉킵니다. 십의 자리로 분야를 나누고 그 안에서 세부를 매기면, 나중에 무엇을 끼워 넣어도 자리가 있습니다.

빈 번호를 남겨 두는 것이 핵심입니다. 50, 60, 70은 나중을 위해 비워 둡니다.

### 규칙 파일이 지도다

폴더 맨 위에 두는 규칙 파일이 이 시스템에서 가장 중요합니다. 어디에 무엇이 있는지, 새로 생긴 파일은 어디로 보낼지를 적어 둡니다.

> 파일 이름 앞에 날짜를 붙이면 **시간 순서가 공짜로 생깁니다.** 나중에 "작년 이맘때 뭐 했지"를 물을 수 있게 됩니다.

### 여덟 걸음으로 만들기

1. **분야를 한두 개만 고른다.** 전부 담으려 하지 마세요. 반복이 가장 심한 곳 하나가 첫 폴더입니다.
2. **인터뷰로 나를 기록한다.** 기억 기능이 있는 챗봇에서 50문답을 돌려 내 프로필 문서를 만듭니다.
3. **로컬 폴더를 만든다.** AI 에디터를 깔고 빈 폴더를 엽니다. 클라우드 동기화 폴더 말고 로컬이어야 합니다.
4. **뼈대를 짓게 한다.** 다음 쪽의 프롬프트로 폴더와 규칙 파일을 만들게 합니다.
5. **백업을 건다.** 비공개 저장소에 복사본을 둡니다. 에이전트에게는 읽기 권한만 줍니다.
6. **진짜 자료를 넣는다.** 첫 분야에만. 회의록, 문서, 메모를 실제로 채웁니다.
7. **대화를 해 본다.** 실제 업무 하나를 이 폴더 안에서 처리해 봅니다.
8. **고칠 때마다 규칙에 적는다.** 이게 시스템을 키우는 유일한 방법입니다.

순서가 있습니다. 1~4는 뼈대, 5~6은 기반, 7~8은 채우기입니다. **네 번째의 구조 잡기를 건너뛰면 나중에 전부 다시 해야 합니다.**

> 한 분야를 한두 주 써 보고 다음 분야로 넘어가세요. 한꺼번에 다 채우면 대부분 방치됩니다.

### 시작을 여는 두 프롬프트

첫째는 뼈대 만들기. 빈 폴더를 연 상태에서 에디터에 그대로 붙여 넣습니다. 둘째는 50문답 인터뷰. 내 대화가 가장 많이 쌓인 챗봇에서 돌립니다.

음성으로 답하면 훨씬 수월합니다. 타이핑보다 빠르고 말투가 그대로 남습니다.

### 역할은 필요할 때 태어난다

전문가 역할을 스무 개 만들어 두는 것은 시간 낭비입니다. 대부분 한 번도 안 씁니다. **같은 요청을 세 번째 하고 있다면** 그때 역할로 만드세요.

| 역할 | 하는 일 |
|---|---|
| 검토자 | 문서의 빈틈과 어긋난 곳만 지적 |
| 비판자 | 반대 논리를 세워 논거를 시험 |
| 정리자 | 흩어진 메모를 주제별로 묶음 |
| 기록자 | 회의록을 정해진 형식으로 변환 |
| 회고자 | 지난 기록과 지금을 비교해 변화 추적 |

> 가장 쓸모 있는 역할은 **회고자**입니다. 한 시점의 기록은 별 의미가 없지만, 폴더에 반년치가 쌓이면 나 혼자서는 못 보던 흐름을 짚어 줍니다.

### 원칙

- **작게 시작한다.** 한 분야를 한두 주 써 보고 다음으로.
- **시간을 준다.** 첫 몇 주는 티가 안 납니다. 한 달이 분기점입니다.
- **한 프로젝트 한 폴더.** 여러 곳에 쪼개면 연결을 못 찾습니다.
- **백업은 읽기 전용으로.** 에이전트에게 쓰기 권한은 주지 않습니다.
- **고칠 때마다 규칙에 적는다.** 이게 유일한 성장 방법입니다.

> 개인정보와 회사 기밀이 한 폴더에 섞입니다. 어떤 모델을 쓸지는 6장 마지막 쪽의 기준을 참고하세요.`,

    /* ===================== 간이 마크다운 렌더러 (플레이북 본문용) ===================== */
    function renderPlaybookMarkdown(md) {
      if (!md) return '';
      const lines = md.split('\n');
      let html = '';
      let inList = false;
      let inTable = false;
      let inCode = false;
      let codeBuf = [];
      let tableBuf = [];

      const inline = (s) =>
        s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
         .replace(/`([^`]+)`/g, '<code style="background:var(--code-bg);padding:1px 6px;border-radius:4px;font-size:0.92em;">$1</code>');

      const flushList = () => { if (inList) { html += '</ul>'; inList = false; } };
      const flushTable = () => {
        if (!inTable) return;
        html += '<table class="pb-table"><thead><tr>';
        const headers = (tableBuf[0] || '').split('|').filter(c => c.trim() !== '');
        headers.forEach(h => { html += '<th>' + inline(h.trim()) + '</th>'; });
        html += '</tr></thead><tbody>';
        for (let i = 2; i < tableBuf.length; i++) {
          const cells = tableBuf[i].split('|').filter(c => c.trim() !== '');
          if (cells.length === 0) continue;
          html += '<tr>';
          cells.forEach(c => { html += '<td>' + inline(c.trim()) + '</td>'; });
          html += '</tr>';
        }
        html += '</tbody></table>';
        tableBuf = [];
        inTable = false;
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.trim().startsWith('```')) {
          if (inCode) {
            html += '<pre>' + codeBuf.join('\n') + '</pre>';
            codeBuf = []; inCode = false;
          } else {
            flushList(); flushTable(); inCode = true;
          }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }

        if (line.startsWith('|') && line.includes('|', 1)) {
          flushList();
          if (!inTable) { inTable = true; tableBuf = []; }
          tableBuf.push(line);
          continue;
        } else if (inTable) {
          flushTable();
        }

        if (line.startsWith('### ')) {
          flushList();
          html += '<h3>' + inline(line.slice(4)) + '</h3>';
        } else if (line.startsWith('## ')) {
          flushList();
          html += '<h2>' + inline(line.slice(3)) + '</h2>';
        } else if (line.startsWith('> ')) {
          flushList();
          html += '<blockquote>' + inline(line.slice(2)) + '</blockquote>';
        } else if (/^\d+\.\s/.test(line)) {
          flushList();
          const m = line.match(/^(\d+)\.\s(.*)/);
          if (m) html += '<p style="margin:4px 0;padding-left:6px;"><strong style="color:var(--playbook-accent);font-family:monospace;">' + m[1] + '.</strong> ' + inline(m[2]) + '</p>';
        } else if (line.startsWith('- ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += '<li>' + inline(line.slice(2)) + '</li>';
        } else if (line.trim() === '') {
          flushList();
          html += '<div style="height:8px;"></div>';
        } else {
          flushList();
          html += '<p>' + inline(line) + '</p>';
        }
      }
      flushList();
      flushTable();
      if (inCode) html += '<pre>' + codeBuf.join('\n') + '</pre>';
      return html;
    }

    /* ===================== 프롬프트 빌더 컴포넌트 ===================== */
    function PromptBuilder({ skeleton, onCopy }) {
      const initValues = {};
      skeleton.fields.forEach(f => { initValues[f.key] = f.default || ''; });
      const [values, setValues] = React.useState(initValues);

      React.useEffect(() => {
        const nv = {};
        skeleton.fields.forEach(f => { nv[f.key] = f.default || ''; });
        setValues(nv);
      }, [skeleton]);

      let preview = skeleton.template;
      skeleton.fields.forEach(f => {
        const v = values[f.key] || ('[' + f.label + ']');
        preview = preview.split('{{' + f.key + '}}').join(v);
      });

      const reset = () => {
        const nv = {};
        skeleton.fields.forEach(f => { nv[f.key] = f.default || ''; });
        setValues(nv);
      };

      const clear = () => {
        const nv = {};
        skeleton.fields.forEach(f => { nv[f.key] = ''; });
        setValues(nv);
      };

      return (
        <div className="pb-builder">
          <div className="pb-builder-title">🛠 {skeleton.title}</div>
          <div className="pb-builder-desc">{skeleton.desc}</div>

          {skeleton.fields.map(f => (
            <div className="pb-var-row" key={f.key} style={f.textarea ? { alignItems: 'flex-start' } : {}}>
              <label className="pb-var-label">{f.label}</label>
              {f.textarea ? (
                <textarea
                  className="pb-var-textarea"
                  value={values[f.key]}
                  onChange={e => setValues({ ...values, [f.key]: e.target.value })}
                />
              ) : (
                <input
                  className="pb-var-input"
                  value={values[f.key]}
                  onChange={e => setValues({ ...values, [f.key]: e.target.value })}
                />
              )}
            </div>
          ))}

          <div className="pb-preview">{preview}</div>

          <div className="pb-btn-row">
            <button className="pb-btn" onClick={() => onCopy(preview)}>📋 프롬프트 복사</button>
            <button className="pb-btn-sub" onClick={reset}>↺ 기본값 되돌리기</button>
            <button className="pb-btn-sub" onClick={clear}>✕ 모두 비우기</button>
          </div>
        </div>
      );
    }

    /* ===================== 체크리스트 컴포넌트 ===================== */
    function Checklist({ items, storageKey }) {
      const [checked, setChecked] = React.useState(() => {
        try {
          const raw = localStorage.getItem(storageKey);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return Array(items.length).fill(false);
      });

      React.useEffect(() => {
        try {
          const raw = localStorage.getItem(storageKey);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.length === items.length) setChecked(parsed);
            else setChecked(Array(items.length).fill(false));
          } else {
            setChecked(Array(items.length).fill(false));
          }
        } catch (e) {}
      }, [storageKey, items.length]);

      const toggle = (i) => {
        const next = [...checked];
        next[i] = !next[i];
        setChecked(next);
        try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch (e) {}
      };

      const doneCount = checked.filter(Boolean).length;

      return (
        <div className="pb-checklist">
          <div className="pb-checklist-title">✅ 보내기 전 점검</div>
          {items.map((it, i) => (
            <div key={i} className={"pb-check-row " + (checked[i] ? 'checked' : '')} onClick={() => toggle(i)}>
              <div className="pb-check-box"></div>
              <span>{it}</span>
            </div>
          ))}
          <div className="pb-progress">진행: {doneCount} / {items.length}</div>
        </div>
      );
    }

    /* ===================== 자유 작성 실습 컴포넌트 ===================== */
    function FreeExercise({ exercise, onCopy }) {
      const [text, setText] = React.useState('');
      const [result, setResult] = React.useState(null);

      React.useEffect(() => { setText(''); setResult(null); }, [exercise.id]);

      const submit = () => {
        if (exercise.check(text)) setResult('good');
        else setResult('bad');
      };

      return (
        <div className="pb-builder" style={{ borderColor: 'var(--accent2)' }}>
          <div className="pb-builder-title" style={{ color: 'var(--accent2)' }}>🎯 {exercise.title}</div>
          <div className="pb-builder-desc">{exercise.hint}</div>
          <textarea
            className="pb-var-textarea"
            style={{ minHeight: 110 }}
            value={text}
            placeholder="여기에 프롬프트를 작성해 보세요..."
            onChange={e => { setText(e.target.value); setResult(null); }}
          />
          <div className="pb-btn-row">
            <button className="pb-btn" onClick={submit}>제출하고 판정받기</button>
            <button className="pb-btn-sub" onClick={() => onCopy(text)}>📋 내 프롬프트 복사</button>
          </div>
          {result === 'good' && (
            <div className="pb-tip" style={{ borderLeftColor: 'var(--color-accent)', background: 'rgba(16,185,129,0.08)', marginTop: 12 }}>
              {exercise.good}
            </div>
          )}
          {result === 'bad' && (
            <div className="pb-tip" style={{ borderLeftColor: '#d05a4e', background: 'rgba(208,90,78,0.08)', marginTop: 12 }}>
              {exercise.bad}
            </div>
          )}
        </div>
      );
    }

          '때', '상황', '이유', '때문에', '결석', '독감', '사고', '파손', 
          '배송', '매출', '실적', '비건', '친환경', '미닝아웃', '보안', 
          '리포트', '대학', '전공', '목표', '과제', '트렌드'
        ];
        const detectedContext = contextKeywords.some(k => val.includes(k)) || val.length >= 15;
        setHasContext(detectedContext);

        const formatKeywords = [
          '표', 'table', '테이블', 'json', '{', '글머리', '기호', '•', 
          '->', '=>', ':', '해시태그', '#', 'faq', 'q&a', '단답', '축약'
        ];
        const detectedFormat = formatKeywords.some(k => val.toLowerCase().includes(k)) || (currentChIdx === 0 && currentSubIdx === 0 && val.length <= 10);
        setHasFormat(detectedFormat);

        const isMissionPassed = currentMission.checkPassed(promptText);
        
        if (isMissionPassed && (currentChIdx === 0 && currentSubIdx === 0 ? true : detectedContext)) {
          setPowerScore(100);
        } else {
          let score = 30;
          if (detectedPersona) score += 20;
          if (detectedContext) score += 20;
          if (detectedFormat) score += 20;
          setPowerScore(Math.min(score, 90));
        }

      }, [promptText, currentChIdx, currentSubIdx]);

      const handleExecute = () => {
        if (!promptText.trim()) return;
        setIsExecuting(true);
        setApiOutput('AI가 전송된 프롬프트를 구문 분석하여 출력 퀄리티 변동 폭을 연산 중입니다...');
        
        const isPassed = powerScore === 100;

        setTimeout(() => {
          if (isPassed) {
            setApiOutput(currentMission.successResponse);
            
            const newList = [...chapterStatusList];
            newList[currentChIdx].practiceSolvedList[currentSubIdx] = true;
            setChapterStatusList(newList);
            
            const allPracticeSolved = newList[currentChIdx].practiceSolvedList.every(v => v === true);
            if (newList[currentChIdx].quizSolved && allPracticeSolved && currentChIdx === unlockedChIdx && unlockedChIdx < 7) {
              setUnlockedChIdx(prev => prev + 1);
            }
          } else {
            setApiOutput(currentMission.badResponse + '\n\n⚠️ [프롬프트 파워 80% 미만 훈수 실패]\n\n"지시하신 문장에 필수 조건 단어가 누락되어 퀄리티 교정이 불가능합니다. 아래 속성 체크리스트의 [✕ 미완료] 항목을 확인하고 문장을 다듬어 전송해 주세요!"');
          }
          setIsExecuting(false);
        }, 900);
      };

      const handleSkip = () => {
        setPromptText(currentMission.answerExample);
        setPowerScore(100);
        setHasPersona(true);
        setHasContext(true);
        setHasFormat(true);
        
        const newList = [...chapterStatusList];
        newList[currentChIdx].practiceSolvedList[currentSubIdx] = true;
        setChapterStatusList(newList);

        setApiOutput('⏭️ [문제 건너뛰기 승인]\n문제를 성공적으로 통과 처리했습니다! 예시 답안 프롬프트가 입력창에 자동으로 세팅되었습니다.\n\n' + currentMission.successResponse);

        const allPracticeSolved = newList[currentChIdx].practiceSolvedList.every(v => v === true);
        if (newList[currentChIdx].quizSolved && allPracticeSolved && currentChIdx === unlockedChIdx && unlockedChIdx < 7) {
          setUnlockedChIdx(prev => prev + 1);
        }
      };

      const applyAnswerExample = () => {
        setPromptText(currentMission.answerExample);
        setShowExample(false);
      };

      const handleQuizSelect = (optIdx) => {
        if (quizAnswered) return;
        setSelectedQuizOpt(optIdx);
        setQuizAnswered(true);

        const newList = [...chapterStatusList];
        const isCorrect = optIdx === currentCh.quizAnswerIdx;
        
        if (isCorrect) {
          newList[currentChIdx].quizSolved = true;
          setChapterStatusList(newList);
          
          const allPracticeSolved = newList[currentChIdx].practiceSolvedList.every(v => v === true);
          if (allPracticeSolved && currentChIdx === unlockedChIdx && unlockedChIdx < 7) {
            setUnlockedChIdx(prev => prev + 1);
          }
        }
      };

      const handleResetQuiz = () => {
        setSelectedQuizOpt(null);
        setQuizAnswered(false);
        const newList = [...chapterStatusList];
        newList[currentChIdx].quizSolved = false;
        setChapterStatusList(newList);
      };

      const handleCopy = () => {
        if (!promptText.trim()) return;
        navigator.clipboard.writeText(promptText).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      };

      const handlePbCopy = (text) => {
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
          setPbToast('✔ 프롬프트가 복사되었습니다');
          setTimeout(() => setPbToast(''), 2000);
        }).catch(() => {
          setPbToast('⚠ 복사 실패 — 수동으로 선택해서 복사해 주세요');
          setTimeout(() => setPbToast(''), 2500);
        });
      };

      // 모드/챕터가 바뀌면 스크롤을 위로
      useEffect(() => {
        const main = document.querySelector('.main');
        if (main) main.scrollTop = 0;
        window.scrollTo(0, 0);
      }, [mode, playbookIdx, currentChIdx]);

      const handleNextSubMission = () => {
        if (currentSubIdx < 2) {
          setCurrentSubIdx(prev => prev + 1);
        }
      };

      const currentChPracticeSolvedCount = chapterStatusList[currentChIdx].practiceSolvedList.filter(Boolean).length;
      const allMissionsSolved = currentChPracticeSolvedCount === 3;

      return (
        <div className="layout">
          
          <aside className="sidebar">
            <div>
              <div className="brand">
                <div className="dot"></div>
                <div>
                  <b>PROMPT MASTER</b>
                  <small>동덕여대 AI콘텐츠제작</small>
                </div>
              </div>

              <div className="section-heading">MASTER CLASS · 1주차</div>
              <div className="toc-list">
                {CHAPTERS.map((ch, idx) => {
                  const isActive = mode === 'master' && idx === currentChIdx;
                  const isDone = chapterStatusList[idx].quizSolved && chapterStatusList[idx].practiceSolvedList.every(v => v === true);

                  return (
                    <div
                      key={ch.id}
                      className={"toc-ch " + (isActive ? "active" : "") + (isDone ? " done" : "")}
                      onClick={() => { setMode('master'); setCurrentChIdx(idx); }}
                    >
                      <span className="toc-num">{String(ch.id).padStart(2, '0')}</span>
                      <span className="toc-label">{ch.title}</span>
                    </div>
                  );
                })}
              </div>

              <div className="section-heading">프롬프트 플레이북</div>
              <div className="toc-list">
                {PLAYBOOK_CHAPTERS.map((ch, idx) => {
                  const isActive = mode === 'playbook' && idx === playbookIdx;
                  return (
                    <div
                      key={ch.id}
                      className={"toc-ch playbook " + (isActive ? "active" : "")}
                      onClick={() => { setMode('playbook'); setPlaybookIdx(idx); }}
                    >
                      <span className="toc-num">{ch.num}</span>
                      <span className="toc-label">{ch.title}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="sidebar-footer">
              <button className="theme-btn" onClick={toggleTheme}>
                {theme === 'dark' ? '☀️ 라이트 모드로 보기' : '🌙 다크 모드로 보기'}
              </button>
              <div style={{ fontSize: 10.5, color: 'var(--ink-dim)', textAlign: 'center' }}>
                AI Innovation Studio · Playbook 통합판
              </div>
            </div>
          </aside>

          <main className="main">
            <div className="content">

              {mode === 'master' && (<React.Fragment>
              <header className="hero">
                <span className="kicker">{currentCh.kicker}</span>
                <h1>{currentCh.title}</h1>
                <p>{currentCh.desc}</p>
              </header>

              <article className="chapter-section">
                <div dangerouslySetInnerHTML={{ __html: currentCh.theory
                  .replace(/\n\n/g, '<br /><br />')
                  .replace(/### (.*)/g, '<h3>$1</h3>')
                  .replace(/\*\*(.*)\*\*/g, '<strong>$1</strong>')
                }} />

                <hr style={{ borderColor: 'var(--line)', margin: '30px 0' }} />

                <section className="pg-terminal">
                  <div className="pg-bar">
                    <i></i><i></i><i></i>
                    <span>PROMPT PLAYGROUND - 실습 세션 ({currentChPracticeSolvedCount}/3 완료)</span>
                  </div>

                  <div className="presets" style={{ display: 'flex', gap: '8px', padding: '10px 14px', background: '#12131a', borderBottom: '1px solid #20232b' }}>
                    {[0, 1, 2].map((sIdx) => {
                      const isCleared = chapterStatusList[currentChIdx].practiceSolvedList[sIdx];
                      const isActive = sIdx === currentSubIdx;
                      return (
                        <button
                          key={sIdx}
                          onClick={() => setCurrentSubIdx(sIdx)}
                          style={{
                            background: isActive ? 'var(--accent)' : '#1c1e27',
                            color: isActive ? '#0e0f13' : '#a7a396',
                            border: '1px solid #2a2d38',
                            borderRadius: '6px',
                            padding: '6px 12px',
                            fontSize: '0.78rem',
                            fontWeight: '700',
                            cursor: 'pointer'
                          }}
                        >
                          {isCleared ? '★ ' : ''}문제 {sIdx + 1}
                        </button>
                      );
                    })}
                  </div>

                  <div className="pg-mission" style={{ flexDirection: 'column', alignItems: 'flex-start', gap: '6px' }}>
                    <div style={{ display: 'flex', gap: '8px', width: '100%', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span className="pg-mission-tag" style={{ background: 'rgba(217, 183, 117, 0.1)', color: '#d9b775', border: '1px solid #d9b775' }}>
                        {currentCh.title} - 문제 0{currentSubIdx + 1}
                      </span>
                      <span style={{ fontSize: '0.75rem', color: '#a7a396' }}>{currentMission.title}</span>
                    </div>
                    <p style={{ fontSize: '0.85rem', color: '#e2efe8', fontWeight: '600', lineHeight: '1.45', marginTop: '6px' }}>
                      {currentMission.situation}
                    </p>
                  </div>

                  <div className="pg-interactive-area">
                    
                    {showExample && (
                      <div style={{
                        background: 'rgba(201, 168, 106, 0.08)',
                        border: '1px dashed var(--accent2)',
                        borderRadius: '8px',
                        padding: '12px',
                        marginBottom: '12px',
                        fontSize: '0.8rem',
                        lineHeight: '1.5'
                      }}>
                        <b style={{ color: 'var(--accent2)', display: 'block', marginBottom: '4px' }}>💡 모범 답안 예시:</b>
                        <p style={{ color: 'var(--ink)', fontStyle: 'italic', marginBottom: '8px' }}>
                          "{currentMission.answerExample}"
                        </p>
                        <button className="theme-btn" style={{ fontSize: '0.7rem', padding: '4px 8px' }} onClick={applyAnswerExample}>
                          👉 이 답안 적용하기 (자동 채우기)
                        </button>
                      </div>
                    )}

                    <textarea 
                      className="pg-textarea"
                      placeholder="상단에 명시된 문제 조건을 충족하는 훈수 프롬프트를 에디터에 작성하세요..."
                      value={promptText}
                      onChange={(e) => setPromptText(e.target.value)}
                      disabled={isExecuting}
                    />

                    <div className="attribute-checklist">
                      <div className={"attr-item " + (hasPersona ? "active" : "inactive")}>
                        <span>{hasPersona ? '✓' : '✕'}</span>
                        <span>페르소나 지정</span>
                      </div>
                      <div className={"attr-item " + (hasContext ? "active" : "inactive")}>
                        <span>{hasContext ? '✓' : '✕'}</span>
                        <span>상황 및 맥락 기술</span>
                      </div>
                      <div className={"attr-item " + (hasFormat ? "active" : "inactive")}>
                        <span>{hasFormat ? '✓' : '✕'}</span>
                        <span>출력 서식 제약</span>
                      </div>
                    </div>

                    <div className="power-gauge">
                      <div className="gauge-header">
                        <span>⚡ 프롬프트 전송 파워</span>
                        <span>{powerScore}%</span>
                      </div>
                      <div className="gauge-track">
                        <div className="gauge-fill" style={{ width: powerScore + "%" }}></div>
                      </div>
                      <span className="gauge-feedback">
                        {currentCh.missions[currentSubIdx].feedbackText(powerScore === 100)}
                      </span>
                    </div>

                    <div className="pg-actions">
                      <div style={{ display: 'flex', gap: '6px' }}>
                        <button className="theme-btn" style={{ padding: '6px 12px', fontSize: '0.78rem' }} onClick={handleCopy}>
                          📋 복사
                        </button>
                        <button className="theme-btn" style={{ padding: '6px 12px', fontSize: '0.78rem', borderColor: 'var(--accent2)' }} onClick={() => setShowExample(!showExample)}>
                          💡 답안 예시 보기
                        </button>
                        <button className="theme-btn" style={{ padding: '6px 12px', fontSize: '0.78rem', borderColor: '#d05a4e' }} onClick={handleSkip}>
                          ⏭️ 건너뛰기
                        </button>
                      </div>
                      <button 
                        className="pg-btn"
                        onClick={handleExecute}
                        disabled={powerScore < 100 || isExecuting}
                      >
                        제미나이 전송 & 실행 (Run)
                      </button>
                    </div>

                    {(apiOutput || isExecuting) && (
                      <pre className="pg-terminal-out">
                        {apiOutput}
                      </pre>
                    )}

                    {chapterStatusList[currentChIdx].practiceSolvedList[currentSubIdx] && (
                      <div className="pg-clear-banner">
                        <span>🎉 문제 {currentSubIdx + 1} 해결 성공!</span>
                        {currentSubIdx < 2 ? (
                          <button className="pg-btn" style={{ fontSize: '0.75rem', padding: '4px 10px' }} onClick={handleNextSubMission}>
                            다음 문제 {currentSubIdx + 2}로 가기 ➡️
                          </button>
                        ) : (
                          <span style={{ fontSize: '0.75rem', color: '#10b981', fontWeight: '800' }}>⭐ 이 챕터의 3가지 실무 문제를 모두 완료했습니다!</span>
                        )}
                      </div>
                    )}
                  </div>
                </section>

                <hr style={{ borderColor: 'var(--line)', margin: '30px 0' }} />

                <section className="quiz" style={{ opacity: allMissionsSolved ? 1 : 0.5 }}>
                  <div className="quiz-head">확인 퀴즈 (Quiz) {!allMissionsSolved && '🔒 [문제 3개 완료 시 잠금해제]'}</div>
                  <div className="quiz-question">{currentCh.quizQuestion}</div>
                  
                  <div className="quiz-opts">
                    {currentCh.quizOptions.map((opt, oIdx) => {
                      let statusClass = '';
                      if (quizAnswered) {
                        if (oIdx === currentCh.quizAnswerIdx) statusClass = 'correct';
                        else if (selectedQuizOpt === oIdx) statusClass = 'wrong';
                      }

                      return (
                        <button 
                          key={oIdx}
                          className={"quiz-opt " + statusClass}
                          onClick={() => allMissionsSolved && handleQuizSelect(oIdx)}
                          disabled={quizAnswered || !allMissionsSolved}
                        >
                          <span className="quiz-mark"></span>
                          <span>{opt}</span>
                        </button>
                      );
                    })}
                  </div>

                  {quizAnswered && (
                    <div className="quiz-explain">
                      <b>해설:</b> {currentCh.quizExplain}
                      {selectedQuizOpt !== currentCh.quizAnswerIdx && (
                        <button className="theme-btn" style={{ marginTop: '10px', display: 'block', fontSize: '0.75rem' }} onClick={handleResetQuiz}>
                          🔄 다시 풀기
                        </button>
                      )}
                    </div>
                  )}
                </section>

                {chapterStatusList[currentChIdx].quizSolved && allMissionsSolved && (
                  <div className="pg-clear-banner" style={{ background: 'rgba(224, 122, 75, 0.1)', borderColor: 'var(--accent)' }}>
                    <span style={{ color: 'var(--accent)' }}>🥇 챕터 {currentCh.id} 완전 정복 완료! 목차에서 다음 챕터를 클릭해 나아가세요.</span>
                    {currentChIdx === 7 && (
                      <button className="pg-btn" style={{ background: 'var(--accent2)' }} onClick={() => setShowCertModal(true)}>
                        👑 수료증 발급받기
                      </button>
                    )}
                  </div>
                )}

              </article>
              </React.Fragment>)}

              {mode === 'playbook' && (
                <PlaybookView
                  chapter={PLAYBOOK_CHAPTERS[playbookIdx]}
                  onCopy={handlePbCopy}
                />
              )}
            </div>
          </main>

          {showCertModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <button className="close-btn" onClick={() => setShowCertModal(false)}>×</button>
                <div className="cert-card">
                  <div className="cert-corner c-tl"></div>
                  <div className="cert-corner c-tr"></div>
                  <div className="cert-corner c-bl"></div>
                  <div className="cert-corner c-br"></div>

                  <div className="cert-univ">DONGDUK WOMEN'S UNIVERSITY</div>
                  <div className="cert-head">수 료 증</div>

                  <div className="cert-main">
                    <input 
                      type="text" 
                      placeholder="본인의 이름을 입력하세요"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      style={{
                        background: 'transparent',
                        border: 'none',
                        borderBottom: '2px solid #d4af37',
                        textAlign: 'center',
                        color: '#fff',
                        fontSize: '1.2rem',
                        fontWeight: 700,
                        width: '60%',
                        marginBottom: '20px',
                        outline: 'none'
                      }}
                    /><br />
                    위 사람은 동덕여대 AI콘텐츠제작 교과목의<br />
                    <strong>[구글 제미나이 기반 프롬프트 엔지니어링 마스터 코스]</strong>를<br />
                    훌륭하게 수행하고 모든 이론 및 실습 평가를 패스하였기에<br />
                    이 증서를 수여합니다.
                  </div>

                  <div className="cert-date">
                    {new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })}
                  </div>
                  <div className="cert-sign">
                    동덕여자대학교 AI콘텐츠제작 담당교수 귀하
                  </div>
                </div>
                <button className="cert-print-btn" onClick={() => window.print()}>
                  🖨️ 수료증 인쇄 및 PDF 저장
                </button>
              </div>
            </div>
          )}

          {copied && (
            <div className="toast-msg" style={{ position: 'fixed', bottom: '20px', right: '20px', background: 'var(--panel)', border: '1px solid var(--line)', padding: '10px 16px', borderRadius: '8px', zIndex: 999 }}>
              <span>✔️ 프롬프트가 복사되었습니다!</span>
            </div>
          )}

          {pbToast && <div className="pb-copy-toast">{pbToast}</div>}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

</body>
</html>
